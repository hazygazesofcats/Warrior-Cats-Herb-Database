</head>

        const grid = document.getElementById('databaseGrid');
        const searchBar = document.getElementById('searchBar');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const modal = document.getElementById('fullscreenModal');
        const modalContent = document.querySelector('.modal-content');
        const modalBody = document.getElementById('modalBody');
        const closeBtn = document.querySelector('.close-btn');

        function displayItems(items) {
            grid.innerHTML = "";
            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = "card " + item.category;
                card.onclick = () => openFullscreen(item);
                card.innerHTML = "<span class='badge " + item.category + "'>" + (item.category === 'travel' ? 'travel herb' : item.category) + "</span><h3>" + item.name + "</h3><p><strong>Description:</strong> " + item.description.substring(0, 60) + "...</p><p><strong>Usage:</strong> " + item.usage.substring(0, 60) + "...</p>";
                grid.appendChild(card);
            });
        }

        function openFullscreen(item) {
            modalContent.className = "modal-content " + item.category;
            modalBody.innerHTML = "<div class='modal-header'><span class='badge " + item.category + "'>" + (item.category === 'travel' ? 'travel herb' : item.category) + "</span><h2>" + item.name + "</h2></div><div class='modal-body-text'><p><strong>Description:</strong> " + item.description + "</p><p><strong>Location:</strong> " + item.location + "</p><p><strong>Usage/Remedy:</strong> " + item.usage + "</p></div>";
            modal.style.display = "flex";
        }

        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

        function filterDatabase() {
            const searchText = searchBar.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            const filtered = databaseItems.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchText) || item.description.toLowerCase().includes(searchText) || item.location.toLowerCase().includes(searchText) || item.usage.toLowerCase().includes(searchText);
                const matchesCategory = activeFilter === 'all' || item.category === activeFilter;
                return matchesSearch && matchesCategory;
            });
            displayItems(filtered);
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                filterDatabase();
            });
        });

        searchBar.addEventListener('input', filterDatabase);
        displayItems(databaseItems);
    </script>
